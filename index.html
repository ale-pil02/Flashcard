    <script>
        // Applica il tema prima del primo disegno, così non c'è il lampo chiaro aprendo in scuro
        (function () {
            try {
                const scelta = localStorage.getItem('flashcard-tema') || 'sistema';
                const scuro = scelta === 'scuro' || (scelta === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.tema = scuro ? 'scuro' : 'chiaro';
            } catch (e) { /* storage non disponibile: resta il tema chiaro */ }
        })();
